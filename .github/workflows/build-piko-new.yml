name: Build Piko patched APKs (New Builder)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets: twitter,instagram"
        required: true
        default: "twitter,instagram"
      cli_version:
        description: "Morphe CLI tag, or latest"
        required: true
        default: "latest"
      patches_version:
        description: "Piko patches channel: dev or stable"
        required: true
        default: "dev"
      continue_on_error:
        description: "Pass --continue-on-error so compatible patches can still be applied if one patch fails"
        required: true
        type: boolean
        default: true
      include_patches:
        description: "Comma-separated disabled patches to enable for this run (e.g. 'Override certificate pinning, Change package name'). Leave blank to use default patch selection."
        required: false
        default: ""
      create_release:
        description: "Create a GitHub Release and attach patched APKs"
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: "Upload patched APKs as a short-lived workflow artifact"
        required: true
        type: boolean
        default: true
      instagram_apk_version:
        description: "Instagram APK Version (leave blank for recommended version)"
        required: false
        default: ""
      twitter_apk_version:
        description: "Twitter APK Version (leave blank for recommended version)"
        required: false
        default: ""
      twitter_google_drive_url:
        description: "Custom Twitter APK/APKM Google Drive link or file ID (optional; overrides normal download)"
        required: false
        default: ""

env:
  MORPHE_PATCHES_REPO: crimera/piko
  APK_SOURCE: apkmirror,apkpure
  APK_VERSION_SOURCE: recommended
  APK_FALLBACK_TO_LATEST: "false"
  APKMIRROR_ARCH: arm64-v8a
  TWITTER_APKMIRROR_TYPE: bundle
  INSTAGRAM_APKMIRROR_TYPE: bundle

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore optional signing keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          APK_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [ -n "$APK_KEYSTORE_B64" ]; then
            if [ -z "$APK_KEYSTORE_PASSWORD" ]; then
              echo "::error::APK_KEYSTORE_B64 is set, but APK_KEYSTORE_PASSWORD is missing."
              exit 1
            fi
            export APK_KEYSTORE_ENTRY_PASSWORD="${APK_KEYSTORE_ENTRY_PASSWORD:-$APK_KEYSTORE_PASSWORD}"

            mkdir -p .secrets
            printf '%s' "$APK_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > .secrets/mistu-release-source.jks

            cat > .secrets/ConvertKeystore.java <<'JAVA'
            import java.io.InputStream;
            import java.io.OutputStream;
            import java.nio.file.Files;
            import java.nio.file.Path;
            import java.security.Key;
            import java.security.KeyStore;
            import java.security.Provider;
            import java.security.Security;
            import java.security.cert.Certificate;
            import org.bouncycastle.jce.provider.BouncyCastleProvider;

            public final class ConvertKeystore {
              private record LoadedStore(KeyStore store, String type) {}

              public static void main(String[] args) throws Exception {
                Path input = Path.of(args[0]);
                Path output = Path.of(args[1]);
                char[] storePassword = requiredEnv("APK_KEYSTORE_PASSWORD").toCharArray();
                char[] entryPassword = envOr("APK_KEYSTORE_ENTRY_PASSWORD", requiredEnv("APK_KEYSTORE_PASSWORD")).toCharArray();
                String alias = envOr("APK_KEYSTORE_ALIAS", "mistu");

                Provider bc = new BouncyCastleProvider();
                if (Security.getProvider(bc.getName()) == null) Security.addProvider(bc);

                LoadedStore loaded = loadStore(input, storePassword);
                Key key = loaded.store().getKey(alias, entryPassword);
                if (key == null) {
                  throw new IllegalStateException("Signing key alias not found in " + loaded.type() + " keystore: " + alias);
                }

                Certificate[] chain = certificateChain(loaded.store(), alias);

                KeyStore bks = KeyStore.getInstance("BKS", "BC");
                bks.load(null, storePassword);
                bks.setKeyEntry(alias, key, entryPassword, chain);

                try (OutputStream stream = Files.newOutputStream(output)) {
                  bks.store(stream, storePassword);
                }
              }

              private static LoadedStore loadStore(Path path, char[] password) throws Exception {
                Exception last = null;
                for (String type : new String[] { "JKS", "PKCS12", "BKS" }) {
                  try {
                    KeyStore store = "BKS".equals(type)
                      ? KeyStore.getInstance(type, "BC")
                      : KeyStore.getInstance(type);
                    try (InputStream stream = Files.newInputStream(path)) {
                      store.load(stream, password);
                    }
                    return new LoadedStore(store, type);
                  } catch (Exception error) {
                    last = error;
                  }
                }

                throw new IllegalStateException("Could not load signing keystore as JKS, PKCS12, or BKS.", last);
              }

              private static Certificate[] certificateChain(KeyStore store, String alias) throws Exception {
                try {
                  Certificate[] chain = store.getCertificateChain(alias);
                  if (chain != null && chain.length > 0) {
                    return chain;
                  }
                } catch (Exception error) {
                  System.err.println("Warning: could not read certificate chain for alias " + alias + ": " + error.getMessage());
                }

                Certificate certificate = store.getCertificate(alias);
                if (certificate != null) {
                  return new Certificate[] { certificate };
                }

                for (java.util.Enumeration<String> aliases = store.aliases(); aliases.hasMoreElements(); ) {
                  String candidate = aliases.nextElement();
                  certificate = store.getCertificate(candidate);
                  if (certificate != null) {
                    System.err.println("Warning: using certificate from alias " + candidate + " for signing key alias " + alias);
                    return new Certificate[] { certificate };
                  }
                }

                throw new IllegalStateException("No certificate found for signing key alias: " + alias);
              }

              private static String requiredEnv(String name) {
                String value = System.getenv(name);
                if (value == null || value.isEmpty()) {
                  throw new IllegalStateException(name + " is required");
                }
                return value;
              }

              private static String envOr(String name, String fallback) {
                String value = System.getenv(name);
                return value == null || value.isEmpty() ? fallback : value;
              }
            }
          JAVA

            # Compile ConvertKeystore using temporary download to fetch CLI if not present,
            # but since node scripts/piko-builder.mjs tools will download it, let's download tools first.
            node scripts/piko-builder.mjs tools

            javac -cp .cache/tools/morphe-cli.jar .secrets/ConvertKeystore.java
            java -cp ".cache/tools/morphe-cli.jar:.secrets" ConvertKeystore \
              .secrets/mistu-release-source.jks \
              .secrets/mistu-release.jks
            echo "KEYSTORE_FILE=.secrets/mistu-release.jks" >> "$GITHUB_ENV"
          fi

      - name: List available patches
        run: |
          node << 'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');

          // Load patches-list.json (downloaded by the tools step)
          const listPath = '.cache/tools/patches-list.json';
          if (!fs.existsSync(listPath)) {
            console.log('
> `patches-list.json` not found. Ensure the Download tools step ran successfully.');
            process.exit(0);
          }

          const patchesList = JSON.parse(fs.readFileSync(listPath, 'utf8'));
          const allPatches = patchesList.patches || [];

          // Load local options files to get user-overridden enabled/disabled state
          const optionsCandidates = [
            'config/youtube-options.json',
            'config/youtube-music-options.json',
            'config/reddit-options.json',
            'config/twitter-options.json',
            'config/instagram-options.json',
            '.morphe-action/options/youtube-stable.json',
            '.morphe-action/options/youtube-music-stable.json',
            '.morphe-action/options/reddit-stable.json',
          ];
          // Build a map: patchName -> enabled (from options files)
          const optionsOverride = {};
          for (const p of optionsCandidates) {
            if (!fs.existsSync(p)) continue;
            try {
              const bundles = JSON.parse(fs.readFileSync(p, 'utf8'));
              const bundle = Array.isArray(bundles) ? bundles[0] : bundles;
              const patches = bundle?.patches;
              if (!patches || typeof patches !== 'object') continue;
              for (const [name, val] of Object.entries(patches)) {
                if (typeof val?.enabled === 'boolean') {
                  optionsOverride[name] = val.enabled;
                }
              }
            } catch {}
          }

          // Collect all apps from compatiblePackages across all patches
          const appMap = new Map(); // packageName -> { appName, patches: [{name, enabled}] }
          for (const patch of allPatches) {
            if (!patch.name) continue;
            const pkgs = patch.compatiblePackages;
            // null compatiblePackages means it applies to all apps — skip for per-app listing
            if (!pkgs || pkgs.length === 0) continue;
            for (const pkg of pkgs) {
              if (!appMap.has(pkg.packageName)) {
                appMap.set(pkg.packageName, { appName: pkg.name || pkg.packageName, patches: [] });
              }
              // Determine enabled state: options file overrides default
              const enabled = optionsOverride.hasOwnProperty(patch.name)
                ? optionsOverride[patch.name]
                : (patch.default !== false);
              appMap.get(pkg.packageName).patches.push({ name: patch.name, enabled });
            }
          }

          if (appMap.size === 0) {
            console.log('
> No compatible-package patch entries found in patches-list.json.');
            process.exit(0);
          }

          console.log('
# Available Patches by App
');
          if (Object.keys(optionsOverride).length > 0) {
            console.log('> ℹ️ Enabled/disabled state reflects your local options files. Patches not in options files use their default state.
');
          } else {
            console.log('> ℹ️ No local options files found. Showing **default** enabled/disabled state from the patch source.
');
          }
          console.log('> To enable a **disabled** patch, copy its exact name into the **include_patches** input.
');
          console.log('---
');

          for (const [pkgName, { appName, patches }] of [...appMap.entries()].sort((a,b) => a[1].appName.localeCompare(b[1].appName))) {
            const enabled = patches.filter(p => p.enabled);
            const disabled = patches.filter(p => !p.enabled);
            console.log(`## ${appName}
`);
            console.log(`> Package: \`${pkgName}\` — **${enabled.length}** enabled, **${disabled.length}** disabled
`);

            console.log(`### ✅ Enabled (${enabled.length})
`);
            if (enabled.length) {
              console.log('| Patch Name |
|------------|');
              for (const p of enabled) console.log(`| ${p.name} |`);
            } else {
              console.log('_None_');
            }

            console.log(`
### ❌ Disabled (${disabled.length})
`);
            if (disabled.length) {
              console.log('| Patch Name |
|------------|');
              for (const p of disabled) console.log(`| ${p.name} |`);
            } else {
              console.log('_None_');
            }
            console.log('
---
');
          }
          NODE

      - name: Configure patch flags
        env:
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const args = [];
          if (process.env.CONTINUE_ON_ERROR === 'true') args.push('--continue-on-error');
          const include = (process.env.INCLUDE_PATCHES || '').split(',').map(s => s.trim()).filter(Boolean);
          for (const patch of include) { args.push('--enable', patch); }
          if (include.length) process.stderr.write(`Enabling extra patches: ${include.join(', ')}\n`);
          console.log(`MORPHE_EXTRA_ARGS_JSON=${JSON.stringify(args)}`);
          NODE

      - name: Build patched APKs
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          MORPHE_PATCHES_VERSION: ${{ inputs.patches_version }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          INSTAGRAM_APK_VERSION: ${{ inputs.instagram_apk_version }}
          TWITTER_APK_VERSION: ${{ inputs.twitter_apk_version }}
          TWITTER_GOOGLE_DRIVE_URL: ${{ inputs.twitter_google_drive_url }}
          MORPHE_EXTRA_ARGS_JSON: ${{ env.MORPHE_EXTRA_ARGS_JSON }}
        run: node scripts/piko-builder.mjs build

      - name: Prepare release summary
        if: ${{ inputs.create_release || inputs.upload_artifact }}
        env:
          INSTAGRAM_APK_VERSION_INPUT: ${{ inputs.instagram_apk_version }}
          TWITTER_APK_VERSION_INPUT: ${{ inputs.twitter_apk_version }}
        run: |
          release_date="$(date -u +'%Y-%m-%d')"
          release_stamp="$(date -u +'%Y%m%d-%H%M%S')"
          resolved_patches_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.MORPHE_PATCHES_VERSION || "dev"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/piko-patches.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"
          resolved_patches_url="$(node -e 'const fs = require("node:fs"); const repo = "crimera/piko"; let tag = process.env.MORPHE_PATCHES_VERSION || "dev"; let url = `https://github.com/${repo}/releases`; try { const meta = JSON.parse(fs.readFileSync(".cache/tools/piko-patches.json", "utf8")); tag = meta.tag || tag; url = meta.url || `https://github.com/${repo}/releases/tag/${encodeURIComponent(tag)}`; } catch {} process.stdout.write(url);')"
          resolved_instagram_version="$(node -e 'const fs = require("node:fs"); let version = process.env.INSTAGRAM_APK_VERSION_INPUT || "auto"; try { version = JSON.parse(fs.readFileSync("output/instagram-result.json", "utf8")).packageVersion || version; } catch {} process.stdout.write(version);')"
          resolved_twitter_version="$(node -e 'const fs = require("node:fs"); let version = process.env.TWITTER_APK_VERSION_INPUT || "auto"; try { version = JSON.parse(fs.readFileSync("output/twitter-result.json", "utf8")).packageVersion || version; } catch {} process.stdout.write(version);')"

          echo "RELEASE_TAG=piko-new-${release_stamp}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Piko patched APKs (New) ${resolved_patches_tag} ${release_date} #${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"

          cat <<EOF > release-notes.md
          ## Piko Build Summary (New Builder)
          
          - Patches: [crimera/piko ${resolved_patches_tag}](${resolved_patches_url}) (New Piko Builder)
          - Architecture: arm64-v8a
          - Instagram APK Version: ${resolved_instagram_version}
          - Twitter APK Version: ${resolved_twitter_version}
          - Twitter Custom Google Drive Link: ${{ inputs.twitter_google_drive_url != '' && 'provided' || 'not provided' }}
          - Date: $(date -u)
          EOF

          if [ -f output/build-summary.md ]; then
            cat output/build-summary.md >> release-notes.md
          fi

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            output/*.apk \
            "$RELEASE_PRERELEASE_FLAG" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md

      - name: Upload patched APKs
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: piko-patched-apks-new
          path: |
            output/*.apk
            output/*-result.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

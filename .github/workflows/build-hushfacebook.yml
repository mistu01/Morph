name: Build Hush Social patched APKs

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Morphe CLI tag, or latest"
        required: true
        default: "dev"
      targets:
        description: "Comma-separated targets: facebook, messenger, threads, instagram"
        required: false
        default: "facebook,messenger,threads,instagram"
      patches_version:
        description: "HushFacebook patch release: stable, dev, latest, or an explicit tag"
        required: true
        default: "stable"
      messenger_patches_version:
        description: "HushMessenger patch release: stable, dev, latest, or an explicit tag"
        required: true
        default: "stable"
      threads_patches_version:
        description: "HushThreads patch release: stable, dev, latest, or an explicit tag"
        required: false
        default: "stable"
      hushgram_patches_version:
        description: "HushGram patch release: stable, dev, latest, or an explicit tag"
        required: false
        default: "stable"
      facebook_version:
        description: "Facebook APK version (blank uses the version recommended by HushFacebook)"
        required: false
        default: ""
      messenger_version:
        description: "Messenger APK version (blank uses the version recommended by HushMessenger)"
        required: false
        default: ""
      threads_version:
        description: "Threads APK version (blank uses the version recommended by HushThreads)"
        required: false
        default: ""
      instagram_version:
        description: "Instagram APK version (blank uses the version recommended by HushGram)"
        required: false
        default: ""
      messenger_apk_url:
        description: "Direct URL to a stock arm64 Messenger APK with an accepted version code (bypasses mirror lookups)"
        required: false
        default: ""
      continue_on_error:
        description: "Continue when an individual compatible patch fails"
        required: true
        type: boolean
        default: true
      include_patches:
        description: "Comma-separated disabled patches to enable for Facebook run"
        required: false
        default: "Use the phone's emoji, Use the system font, Download any video, Material You theme, Tag suggestions only after @"
      create_release:
        description: "Create a GitHub Release and attach the patched APK"
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: "Upload the patched APK as a short-lived workflow artifact"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Optional release tag override"
        required: false
        default: ""

  workflow_call:
    inputs:
      cli_version:
        type: string
        default: "dev"
      targets:
        type: string
        default: "facebook,messenger,threads,instagram"
      patches_version:
        type: string
        default: "stable"
      messenger_patches_version:
        type: string
        default: "stable"
      threads_patches_version:
        type: string
        default: "stable"
      hushgram_patches_version:
        type: string
        default: "stable"
      facebook_version:
        type: string
        default: ""
      messenger_version:
        type: string
        default: ""
      threads_version:
        type: string
        default: ""
      instagram_version:
        type: string
        default: ""
      messenger_apk_url:
        type: string
        default: ""
      continue_on_error:
        type: boolean
        default: true
      include_patches:
        type: string
        default: "Use the phone's emoji, Use the system font, Download any video, Material You theme, Tag suggestions only after @"
      create_release:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: true
      release_tag:
        type: string
        default: ""

env:
  APK_SOURCE: apkmirror,apkpure
  APK_VERSION_SOURCE: recommended
  APK_FALLBACK_TO_LATEST: "false"
  APKMIRROR_ARCH: arm64-v8a
  FACEBOOK_APKMIRROR_TYPE: bundle
  FACEBOOK_APKMIRROR_DPI: any
  MORPHE_ALLOW_UNIVERSAL_APKS_FOR_ABI: "0"

jobs:
  build:
    name: Build Hush social apps (${{ inputs.targets || 'all' }})
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download HushFacebook tools
        if: contains(inputs.targets, 'facebook')
        env:
          BUILD_TARGETS: facebook
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHFACEBOOK_PATCHES_VERSION: ${{ inputs.patches_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/hushfacebook-builder.mjs tools
          cp .cache/tools/patches.json .cache/tools/patches-facebook.json || true

      - name: Restore optional signing keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          APK_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
        run: bash .github/scripts/restore-morphe-keystore.sh

      - name: List available patches
        run: node .github/scripts/list-patches.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Configure patch flags
        env:
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const args = [];
          if (process.env.CONTINUE_ON_ERROR === 'true') args.push('--continue-on-error');
          const include = (process.env.INCLUDE_PATCHES || '').split(',').map(s => s.trim()).filter(Boolean);
          for (const patch of include) args.push('--enable', patch);
          if (include.length) process.stderr.write(`Enabling extra patches: ${include.join(', ')}\n`);
          console.log(`MORPHE_EXTRA_ARGS_JSON=${JSON.stringify(args)}`);
          NODE

      - name: Build patched Facebook APK
        if: contains(inputs.targets, 'facebook')
        continue-on-error: true
        env:
          BUILD_TARGETS: facebook
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHFACEBOOK_PATCHES_VERSION: ${{ inputs.patches_version }}
          FACEBOOK_APK_VERSION: ${{ inputs.facebook_version }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SIGNER_NAME: Mistu
          MORPHE_EXTRA_ARGS_JSON: ${{ env.MORPHE_EXTRA_ARGS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hushfacebook-builder.mjs build

      - name: Download HushMessenger tools
        if: contains(inputs.targets, 'messenger')
        env:
          BUILD_TARGETS: messenger
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHMESSENGER_PATCHES_VERSION: ${{ inputs.messenger_patches_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/hushfacebook-builder.mjs tools
          cp .cache/tools/patches.json .cache/tools/patches-messenger.json || true

      - name: Build patched Messenger APK
        if: contains(inputs.targets, 'messenger')
        continue-on-error: true
        env:
          BUILD_TARGETS: messenger
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHMESSENGER_PATCHES_VERSION: ${{ inputs.messenger_patches_version }}
          MESSENGER_APK_VERSION: ${{ inputs.messenger_version }}
          MESSENGER_APK_URL: ${{ inputs.messenger_apk_url }}
          CONTINUE_ON_ERROR: "false"
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SIGNER_NAME: Mistu
          MORPHE_EXTRA_ARGS_JSON: '[]'
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-hushmessenger.sh

      - name: Download HushThreads tools
        if: contains(inputs.targets, 'threads')
        env:
          BUILD_TARGETS: threads
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHTHREADS_PATCHES_VERSION: ${{ inputs.threads_patches_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/hushfacebook-builder.mjs tools
          cp .cache/tools/patches.json .cache/tools/patches-threads.json || true

      - name: Build patched Threads APK
        if: contains(inputs.targets, 'threads')
        continue-on-error: true
        env:
          BUILD_TARGETS: threads
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHTHREADS_PATCHES_VERSION: ${{ inputs.threads_patches_version }}
          THREADS_APK_VERSION: ${{ inputs.threads_version }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SIGNER_NAME: Mistu
          MORPHE_EXTRA_ARGS_JSON: '[]'
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hushfacebook-builder.mjs build

      - name: Download HushGram tools
        if: contains(inputs.targets, 'instagram') || contains(inputs.targets, 'hushgram')
        env:
          BUILD_TARGETS: instagram
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHGRAM_PATCHES_VERSION: ${{ inputs.hushgram_patches_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/hushfacebook-builder.mjs tools
          cp .cache/tools/patches.json .cache/tools/patches-hushgram.json || true

      - name: Build patched Instagram APK
        if: contains(inputs.targets, 'instagram') || contains(inputs.targets, 'hushgram')
        continue-on-error: true
        env:
          BUILD_TARGETS: instagram
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          HUSHGRAM_PATCHES_VERSION: ${{ inputs.hushgram_patches_version }}
          INSTAGRAM_APK_VERSION: ${{ inputs.instagram_version }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          SIGNER_NAME: Mistu
          MORPHE_EXTRA_ARGS_JSON: '[]'
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hushfacebook-builder.mjs build

      - name: Validate release outputs
        if: ${{ inputs.create_release || inputs.upload_artifact }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          MORPHE_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          MORPHE_EXTRA_ARGS_JSON: ${{ env.MORPHE_EXTRA_ARGS_JSON }}
        run: node scripts/hushfacebook-builder.mjs release-check

      - name: Prepare release metadata
        if: ${{ inputs.create_release || inputs.upload_artifact }}
        env:
          HUSHFACEBOOK_PATCHES_VERSION: ${{ inputs.patches_version }}
          HUSHMESSENGER_PATCHES_VERSION: ${{ inputs.messenger_patches_version }}
          HUSHTHREADS_PATCHES_VERSION: ${{ inputs.threads_patches_version }}
          HUSHGRAM_PATCHES_VERSION: ${{ inputs.hushgram_patches_version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_date="$(date -u +'%Y-%m-%d')"
          release_stamp="$(date -u +'%Y%m%d-%H%M%S')"
          resolved_facebook_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.HUSHFACEBOOK_PATCHES_VERSION || "stable"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches-facebook.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"
          resolved_messenger_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.HUSHMESSENGER_PATCHES_VERSION || "stable"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches-messenger.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"
          resolved_threads_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.HUSHTHREADS_PATCHES_VERSION || "stable"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches-threads.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"
          resolved_hushgram_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.HUSHGRAM_PATCHES_VERSION || "stable"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches-hushgram.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"
          release_prerelease_flag=""
          for tag in "$resolved_facebook_tag" "$resolved_messenger_tag" "$resolved_threads_tag" "$resolved_hushgram_tag"; do
            if [[ "${tag,,}" == *dev* || "${tag,,}" == *pre* || "${tag,,}" == *beta* || "${tag,,}" == *rc* ]]; then
              release_prerelease_flag="--prerelease"
              break
            fi
          done

          release_tag="${INPUT_RELEASE_TAG:-hushsocial-${release_stamp}-${GITHUB_RUN_NUMBER}}"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          title_parts=()
          if [ -f ".cache/tools/patches-facebook.json" ]; then title_parts+=("FB ${resolved_facebook_tag}"); fi
          if [ -f ".cache/tools/patches-messenger.json" ]; then title_parts+=("Msg ${resolved_messenger_tag}"); fi
          if [ -f ".cache/tools/patches-threads.json" ]; then title_parts+=("Threads ${resolved_threads_tag}"); fi
          if [ -f ".cache/tools/patches-hushgram.json" ]; then title_parts+=("HushGram ${resolved_hushgram_tag}"); fi
          title_str="$(IFS=' + '; echo "${title_parts[*]}")"
          if [ -z "$title_str" ]; then title_str="${resolved_facebook_tag}"; fi

          echo "RELEASE_NAME=Hush Social Apps (${title_str}) ${release_date} #${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE_FLAG=${release_prerelease_flag}" >> "$GITHUB_ENV"
          node scripts/hushfacebook-builder.mjs release-notes > release-notes.md

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [ -n "$RELEASE_PRERELEASE_FLAG" ]; then release_args+=("$RELEASE_PRERELEASE_FLAG"); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Updating release..."
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets-to-delete.txt || true
            if [ -s assets-to-delete.txt ]; then
              echo "Wiping existing release assets..."
              while IFS= read -r asset; do
                asset="${asset//$'\r'/}"
                if [ -n "$asset" ]; then
                  echo "Deleting old asset: $asset"
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
                fi
              done < assets-to-delete.txt
            else
              echo "No old release artifacts to wipe."
            fi
            gh release upload "$RELEASE_TAG" output/*.apk --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_NAME" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" output/*.apk "${release_args[@]}" \
              --title "$RELEASE_NAME" --notes-file release-notes.md
          fi

      - name: Upload patched APKs
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: hush-social-patched-apks
          path: |
            output/*.apk
            output/*-result.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

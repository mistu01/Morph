name: Build Piko patched APKs

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets: twitter,instagram"
        required: true
        default: "twitter,instagram"
      cli_version:
        description: "Morphe CLI tag, or latest"
        required: true
        default: "latest"
      patches_version:
        description: "Ignored; this workflow always uses the latest beta Piko patches"
        required: true
        default: "dev"
      apk_version_source:
        description: "Ignored; this workflow pins X and Instagram APK versions"
        required: true
        default: "recommended"
      apk_fallback_to_latest:
        description: "Ignored; pinned APK versions must be available on APKMirror"
        required: true
        type: boolean
        default: false
      force_patch:
        description: "Ignored; --force is always enabled"
        required: true
        type: boolean
        default: true
      continue_on_error:
        description: "Pass --continue-on-error so compatible patches can still be applied if one patch fails"
        required: true
        type: boolean
        default: true
      create_release:
        description: "Create a GitHub Release and attach patched APKs"
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: "Upload patched APKs as a short-lived workflow artifact"
        required: true
        type: boolean
        default: true

env:
  MORPHE_PATCHES_REPO: crimera/piko
  MORPHE_PATCHES_VERSION: "dev"
  APK_SOURCE: apkmirror
  APK_VERSION_SOURCE: recommended
  APK_FALLBACK_TO_LATEST: "false"
  TWITTER_APK_VERSION: "11.81.0-release.0"
  TWITTER_APKMIRROR_TYPE: bundle
  INSTAGRAM_APK_VERSION: "426.0.0.37.68"
  INSTAGRAM_APKMIRROR_TYPE: bundle

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Morphe tools
        env:
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
        run: node scripts/morphe.mjs tools

      - name: Restore optional signing keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          APK_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [ -n "$APK_KEYSTORE_B64" ]; then
            if [ -z "$APK_KEYSTORE_PASSWORD" ] || [ -z "$APK_KEYSTORE_ENTRY_PASSWORD" ]; then
              echo "::error::APK_KEYSTORE_B64 is set, but APK_KEYSTORE_PASSWORD or APK_KEYSTORE_ENTRY_PASSWORD is missing."
              exit 1
            fi
            mkdir -p .secrets
            printf '%s' "$APK_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > .secrets/mistu-release-source.jks

            cat > .secrets/ConvertKeystore.java <<'JAVA'
            import java.io.InputStream;
            import java.io.OutputStream;
            import java.nio.file.Files;
            import java.nio.file.Path;
            import java.security.Key;
            import java.security.KeyStore;
            import java.security.Provider;
            import java.security.Security;
            import java.security.cert.Certificate;
            import org.bouncycastle.jce.provider.BouncyCastleProvider;

            public final class ConvertKeystore {
              private record LoadedStore(KeyStore store, String type) {}

              public static void main(String[] args) throws Exception {
                Path input = Path.of(args[0]);
                Path output = Path.of(args[1]);
                char[] storePassword = requiredEnv("APK_KEYSTORE_PASSWORD").toCharArray();
                char[] entryPassword = envOr("APK_KEYSTORE_ENTRY_PASSWORD", requiredEnv("APK_KEYSTORE_PASSWORD")).toCharArray();
                String alias = envOr("APK_KEYSTORE_ALIAS", "mistu");

                Provider bc = new BouncyCastleProvider();
                if (Security.getProvider(bc.getName()) == null) Security.addProvider(bc);

                LoadedStore loaded = loadStore(input, storePassword);
                Key key = loaded.store().getKey(alias, entryPassword);
                if (key == null) {
                  throw new IllegalStateException("Signing key alias not found in " + loaded.type() + " keystore: " + alias);
                }

                Certificate[] chain = loaded.store().getCertificateChain(alias);
                if (chain == null) {
                  Certificate certificate = loaded.store().getCertificate(alias);
                  if (certificate == null) {
                    throw new IllegalStateException("No certificate found for signing key alias: " + alias);
                  }
                  chain = new Certificate[] { certificate };
                }

                KeyStore bks = KeyStore.getInstance("BKS", "BC");
                bks.load(null, storePassword);
                bks.setKeyEntry(alias, key, entryPassword, chain);

                try (OutputStream stream = Files.newOutputStream(output)) {
                  bks.store(stream, storePassword);
                }
              }

              private static LoadedStore loadStore(Path path, char[] password) throws Exception {
                Exception last = null;
                for (String type : new String[] { "JKS", "PKCS12", "BKS" }) {
                  try {
                    KeyStore store = "BKS".equals(type)
                      ? KeyStore.getInstance(type, "BC")
                      : KeyStore.getInstance(type);
                    try (InputStream stream = Files.newInputStream(path)) {
                      store.load(stream, password);
                    }
                    return new LoadedStore(store, type);
                  } catch (Exception error) {
                    last = error;
                  }
                }

                throw new IllegalStateException("Could not load signing keystore as JKS, PKCS12, or BKS.", last);
              }

              private static String requiredEnv(String name) {
                String value = System.getenv(name);
                if (value == null || value.isEmpty()) {
                  throw new IllegalStateException(name + " is required");
                }
                return value;
              }

              private static String envOr(String name, String fallback) {
                String value = System.getenv(name);
                return value == null || value.isEmpty() ? fallback : value;
              }
            }
          JAVA

            javac -cp .cache/tools/morphe-cli.jar .secrets/ConvertKeystore.java
            java -cp ".cache/tools/morphe-cli.jar:.secrets" ConvertKeystore \
              .secrets/mistu-release-source.jks \
              .secrets/mistu-release.jks
            echo "KEYSTORE_FILE=.secrets/mistu-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Configure Morphe patch flags
        env:
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const args = ["--force"];
          if (process.env.CONTINUE_ON_ERROR === "true") args.push("--continue-on-error");
          console.log(`MORPHE_EXTRA_ARGS_JSON=${JSON.stringify(args)}`);
          NODE

      - name: Build patched APKs
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          SIGNER_NAME: Mistu
        run: node scripts/morphe.mjs build

      - name: Validate release outputs
        if: ${{ inputs.create_release || inputs.upload_artifact }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          MORPHE_EXTRA_ARGS_JSON: ${{ env.MORPHE_EXTRA_ARGS_JSON }}
        run: node scripts/morphe.mjs release-check

      - name: Prepare release summary
        if: ${{ inputs.create_release || inputs.upload_artifact }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
        run: |
          release_date="$(date -u +'%Y-%m-%d')"
          release_stamp="$(date -u +'%Y%m%d-%H%M%S')"
          resolved_patches_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.MORPHE_PATCHES_VERSION || "dev"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"

          echo "RELEASE_TAG=piko-${release_stamp}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Piko patched APKs ${resolved_patches_tag} ${release_date} #${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"

          node <<'NODE' > release-notes.md
          const fs = require("node:fs");
          const path = require("node:path");

          const targets = (process.env.BUILD_TARGETS || "twitter,instagram")
            .split(/[,\s]+/)
            .filter(Boolean);
          const versions = {
            twitter: process.env.TWITTER_APK_VERSION,
            instagram: process.env.INSTAGRAM_APK_VERSION,
          };
          const patchesMeta = readJson(".cache/tools/patches.json");
          const lines = [
            "## Build summary",
            "",
            `- Patches: ${process.env.MORPHE_PATCHES_REPO} ${patchesMeta?.tag || process.env.MORPHE_PATCHES_VERSION || "dev"} (beta)`,
            "- APK source: APKMirror",
            "- Patch flags: `--force`",
            "",
          ];

          for (const target of targets) {
            const result = readJson(path.join("output", `${target}-result.json`));
            const apks = fs.existsSync("output")
              ? fs.readdirSync("output").filter((file) => file.startsWith(`${target}-`) && file.endsWith(".apk"))
              : [];
            const applied = Array.isArray(result?.appliedPatches) ? result.appliedPatches.length : 0;
            const failed = Array.isArray(result?.failedPatches) ? result.failedPatches.length : 0;
            lines.push(`- ${target}: APK ${versions[target] || "configured"}, ${apks.join(", ") || "no APK output"}, patches ${applied} ok / ${failed} failed`);
          }

          lines.push("");
          lines.push(`Commit: ${process.env.GITHUB_SHA}`);
          console.log(lines.join("\n"));

          function readJson(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              return null;
            }
          }
          NODE

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            output/*.apk \
            "$RELEASE_PRERELEASE_FLAG" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md

      - name: Upload patched APKs
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: piko-patched-apks
          path: |
            output/*.apk
            output/*-result.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

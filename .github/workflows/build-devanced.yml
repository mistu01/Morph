name: Build De-Vanced APKs

# ─────────────────────────────────────────────────────────────────────────────
# De-Vanced patches — https://github.com/RookieEnough/De-Vanced
#
# Supported apps (select via the "targets" input):
#
#   DEFAULT (checked by default):
#     messenger          → com.facebook.orca          — Disable typing indicator, Hide inbox ads, …
#     google-photos      → com.google.android.apps.photos — Spoof features, Backup control, …
#     threads            → com.instagram.barcelona    — Hide Ads
#     tiktok             → com.zhiliaoapp.musically   — Downloads, Playback speed, Feed filter, …
#
#   ADDITIONAL (opt-in):
#     adobe-photoshopmix → com.adobe.photoshopmix         — Bypass login
#     amazon             → com.amazon.mShop.android.shopping — Always allow deep-linking
#     angulus            → com.drinkplusplus.angulus       — Hide Ads
#     bandcamp           → com.bandcamp.android            — Remove play limits
#     cricbuzz           → com.cricbuzz.android            — Disable ads
#     disney-plus        → com.disney.disneyplus           — Skip ads
#     facebook           → com.facebook.katana             — Hide Ads, Hide story ads
#     gmx-mail           → de.gmx.mobile.android.mail      — Hide Ads, Force FreePhone
#     google-news        → com.google.android.apps.magazines — Custom tabs, GMS support
#     google-recorder    → com.google.android.apps.recorder  — Remove device restrictions
#     hexedit            → com.myprog.hexedit              — Hide Ads
#     icon-pack-studio   → ginlemon.iconpackstudio          — Unlock Pro
#     inshorts           → com.nis.app                     — Hide ads
#     ir-plus            → net.binarymode.android.irplus   — Hide Ads
#     letterboxd         → com.letterboxd.letterboxd        — Hide ads, Unlock app icons
#     ms-office-lens     → com.microsoft.office.officelens  — Hide OneDrive migration
#     nothing-smartcenter → com.nothing.smartcenter         — Hide Ads
#     nu-nl              → nl.sanomamedia.android.nu        — Hide Ads
#     peacock            → com.peacocktv.peacockandroid     — Hide Ads
#     photomath          → com.microblink.photomath         — Unlock Plus, Spoof device ID
#     pixiv              → jp.pxv.android                  — Hide ads
#     proton-mail        → ch.protonmail.android            — Remove sent-from signature
#     rar                → com.rarlab.rar                  — Hide purchase reminder
#     soundcloud         → com.soundcloud.android          — Offline sync, Hide ads
#     strava             → com.strava                      — Unlock subscription, Block tracking
#     tumblr             → com.tumblr                      — Disable ads, Override feature flags
#     twitch             → tv.twitch.android.app           — Block audio/video/embedded ads
#     viber              → com.viber.voip                  — Hide Ads, Hide navigation buttons
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      targets:
        description: >
          Comma-separated De-Vanced app targets to build.
          Supported: messenger, google-photos, threads, tiktok,
          adobe-photoshopmix, amazon, angulus, bandcamp, cricbuzz,
          disney-plus, facebook, gmx-mail, google-news, google-recorder,
          hexedit, icon-pack-studio, inshorts, ir-plus, letterboxd,
          ms-office-lens, nothing-smartcenter, nu-nl, peacock, photomath,
          pixiv, proton-mail, rar, soundcloud, strava, tumblr, twitch, viber
        required: true
        default: "messenger,google-photos,threads,tiktok"
      cli_version:
        description: "Morphe CLI tag, or latest/dev"
        required: true
        default: "dev"
      patches_version:
        description: "De-Vanced patches tag, or stable/dev/latest"
        required: true
        default: "stable"
      apk_version_source:
        description: "APK version source: recommended, latest-compatible, or latest"
        required: true
        type: choice
        default: "recommended"
        options:
          - "recommended"
          - "latest-compatible"
          - "latest"
      apk_fallback_to_latest:
        description: "Fall back to latest available APK if recommended version disappears"
        required: true
        type: boolean
        default: false
      force_patch:
        description: "Pass --force to skip APK version compatibility checks"
        required: true
        type: boolean
        default: true
      continue_on_error:
        description: "Pass --continue-on-error so compatible patches apply even if one fails"
        required: true
        type: boolean
        default: true
      include_patches:
        description: "Comma-separated disabled patches to enable for this run. Leave blank for defaults."
        required: false
        default: ""
      create_release:
        description: "Create a GitHub Release and attach built APKs"
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: "Upload APKs as a short-lived workflow artifact (1 day)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build De-Vanced APKs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download De-Vanced tools
        env:
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          DEVANCED_PATCHES_VERSION: ${{ inputs.patches_version }}
          MORPHE_PATCHES_VERSION: ${{ inputs.patches_version }}
          DEVANCED_PATCHES_REPO: RookieEnough/De-Vanced
          MORPHE_PATCHES_REPO: RookieEnough/De-Vanced
        run: node scripts/devanced-builder.mjs tools

      - name: Restore optional signing keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          APK_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [ -n "$APK_KEYSTORE_B64" ]; then
            if [ -z "$APK_KEYSTORE_PASSWORD" ] || [ -z "$APK_KEYSTORE_ENTRY_PASSWORD" ]; then
              echo "::error::APK_KEYSTORE_B64 is set, but APK_KEYSTORE_PASSWORD or APK_KEYSTORE_ENTRY_PASSWORD is missing."
              exit 1
            fi
            mkdir -p .secrets
            printf '%s' "$APK_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > .secrets/mistu-release-source.jks

            cat > .secrets/ConvertKeystore.java <<'JAVA'
            import java.io.InputStream;
            import java.io.OutputStream;
            import java.nio.file.Files;
            import java.nio.file.Path;
            import java.security.Key;
            import java.security.KeyStore;
            import java.security.Provider;
            import java.security.Security;
            import java.security.cert.Certificate;
            import org.bouncycastle.jce.provider.BouncyCastleProvider;

            public final class ConvertKeystore {
              private record LoadedStore(KeyStore store, String type) {}

              public static void main(String[] args) throws Exception {
                Path input = Path.of(args[0]);
                Path output = Path.of(args[1]);
                char[] storePassword = requiredEnv("APK_KEYSTORE_PASSWORD").toCharArray();
                char[] entryPassword = envOr("APK_KEYSTORE_ENTRY_PASSWORD", requiredEnv("APK_KEYSTORE_PASSWORD")).toCharArray();
                String alias = envOr("APK_KEYSTORE_ALIAS", "mistu");

                Provider bc = new BouncyCastleProvider();
                if (Security.getProvider(bc.getName()) == null) Security.addProvider(bc);

                LoadedStore loaded = loadStore(input, storePassword);
                Key key = loaded.store().getKey(alias, entryPassword);
                if (key == null) {
                  throw new IllegalStateException("Signing key alias not found in " + loaded.type() + " keystore: " + alias);
                }

                Certificate[] chain = loaded.store().getCertificateChain(alias);
                if (chain == null) {
                  Certificate certificate = loaded.store().getCertificate(alias);
                  if (certificate == null) {
                    throw new IllegalStateException("No certificate found for signing key alias: " + alias);
                  }
                  chain = new Certificate[] { certificate };
                }

                KeyStore bks = KeyStore.getInstance("BKS", "BC");
                bks.load(null, storePassword);
                bks.setKeyEntry(alias, key, entryPassword, chain);

                try (OutputStream stream = Files.newOutputStream(output)) {
                  bks.store(stream, storePassword);
                }
              }

              private static LoadedStore loadStore(Path path, char[] password) throws Exception {
                Exception last = null;
                for (String type : new String[] { "JKS", "PKCS12", "BKS" }) {
                  try {
                    KeyStore store = "BKS".equals(type)
                      ? KeyStore.getInstance(type, "BC")
                      : KeyStore.getInstance(type);
                    try (InputStream stream = Files.newInputStream(path)) {
                      store.load(stream, password);
                    }
                    return new LoadedStore(store, type);
                  } catch (Exception error) {
                    last = error;
                  }
                }

                throw new IllegalStateException("Could not load signing keystore as JKS, PKCS12, or BKS.", last);
              }

              private static String requiredEnv(String name) {
                String value = System.getenv(name);
                if (value == null || value.isEmpty()) {
                  throw new IllegalStateException(name + " is required");
                }
                return value;
              }

              private static String envOr(String name, String fallback) {
                String value = System.getenv(name);
                return value == null || value.isEmpty() ? fallback : value;
              }
            }
            JAVA

            javac -cp .cache/tools/morphe-cli.jar .secrets/ConvertKeystore.java
            java -cp ".cache/tools/morphe-cli.jar:.secrets" ConvertKeystore \
              .secrets/mistu-release-source.jks \
              .secrets/mistu-release.jks
            echo "KEYSTORE_FILE=.secrets/mistu-release.jks" >> "$GITHUB_ENV"
          fi

      - name: List available De-Vanced patches
        run: node .github/scripts/list-patches.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Configure De-Vanced patch flags
        env:
          FORCE_PATCH: ${{ inputs.force_patch }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const args = [];
          if (process.env.FORCE_PATCH === 'true') args.push('--force');
          if (process.env.CONTINUE_ON_ERROR === 'true') args.push('--continue-on-error');
          const include = (process.env.INCLUDE_PATCHES || '').split(',').map(s => s.trim()).filter(Boolean);
          for (const patch of include) { args.push('--enable', patch); }
          if (include.length) process.stderr.write(`Enabling extra patches: ${include.join(', ')}\n`);
          console.log(`MORPHE_EXTRA_ARGS_JSON=${JSON.stringify(args)}`);
          NODE

      - name: Build De-Vanced patched APKs
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          DEVANCED_PATCHES_VERSION: ${{ inputs.patches_version }}
          MORPHE_PATCHES_VERSION: ${{ inputs.patches_version }}
          DEVANCED_PATCHES_REPO: RookieEnough/De-Vanced
          MORPHE_PATCHES_REPO: RookieEnough/De-Vanced
          APK_SOURCE: apkmirror,apkpure
          APK_VERSION_SOURCE: ${{ inputs.apk_version_source }}
          APK_FALLBACK_TO_LATEST: ${{ inputs.apk_fallback_to_latest }}
          # Per-app APK URL overrides (optional secrets)
          MESSENGER_APK_URL: ${{ secrets.MESSENGER_APK_URL }}
          GOOGLE_PHOTOS_APK_URL: ${{ secrets.GOOGLE_PHOTOS_APK_URL }}
          THREADS_APK_URL: ${{ secrets.THREADS_APK_URL }}
          TIKTOK_APK_URL: ${{ secrets.TIKTOK_APK_URL }}
          FACEBOOK_APK_URL: ${{ secrets.FACEBOOK_APK_URL }}
          TWITCH_APK_URL: ${{ secrets.TWITCH_APK_URL }}
          SOUNDCLOUD_APK_URL: ${{ secrets.SOUNDCLOUD_APK_URL }}
          STRAVA_APK_URL: ${{ secrets.STRAVA_APK_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          SIGNER_NAME: Mistu
        run: node scripts/devanced-builder.mjs build

      - name: Prepare release metadata
        if: ${{ inputs.create_release || inputs.upload_artifact }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          APK_VERSION_SOURCE: ${{ inputs.apk_version_source }}
          APK_FALLBACK_TO_LATEST: ${{ inputs.apk_fallback_to_latest }}
          GH_TOKEN: ${{ github.token }}
          DEVANCED_PATCHES_VERSION: ${{ inputs.patches_version }}
          PATCHES_VERSION: ${{ inputs.patches_version }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          release_date="$(date -u +'%Y-%m-%d')"
          release_stamp="$(date -u +'%Y%m%d-%H%M%S')"
          tag="devanced-${release_stamp}-${GITHUB_RUN_NUMBER}"
          name_prefix="De-Vanced patched APKs"

          release_prerelease_flag=""
          resolved_patches_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.PATCHES_VERSION || "latest"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"

          case "${PATCHES_VERSION,,}" in
            dev|pre|preview|prerelease|pre-release)
              release_prerelease_flag="--prerelease"
              ;;
            stable|latest)
              release_prerelease_flag=""
              ;;
            *)
              patches_tag="$PATCHES_VERSION"
              if [[ "$patches_tag" != v* ]]; then
                patches_tag="v${patches_tag}"
              fi
              if [ "$(gh api "repos/RookieEnough/De-Vanced/releases/tags/${patches_tag}" --jq '.prerelease' 2>/dev/null || echo false)" = "true" ]; then
                release_prerelease_flag="--prerelease"
              fi
              ;;
          esac

          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${name_prefix} ${resolved_patches_tag} ${release_date} #${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE_FLAG=${release_prerelease_flag}" >> "$GITHUB_ENV"

          node scripts/devanced-builder.mjs release-notes > release-notes.md

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [ -n "$RELEASE_PRERELEASE_FLAG" ]; then
            release_args+=("$RELEASE_PRERELEASE_FLAG")
          fi

          files_to_upload=()
          for f in output/*.apk; do
            if [ -f "$f" ]; then
              files_to_upload+=("$f")
            fi
          done

          if [ ${#files_to_upload[@]} -eq 0 ]; then
            echo "::error::No APKs found to attach to the release."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "${files_to_upload[@]}" \
            "${release_args[@]}" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md

      - name: Upload De-Vanced patched APKs
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: devanced-patched-apks
          path: |
            output/*.apk
            output/*-result.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

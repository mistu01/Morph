name: Watch Morphe patches

on:
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:

jobs:
  watch:
    name: Trigger build on new patch release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check latest Morphe patch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/MorpheApp/morphe-patches/releases/latest --jq '.tag_name')"
          already_released=""

          while IFS= read -r release_tag; do
            if [ -z "$release_tag" ]; then
              continue
            fi

            release_body="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)"
            if printf '%s\n' "$release_body" | grep -Fq -- "- Morphe patches: ${latest}"; then
              already_released="$release_tag"
              break
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')

          echo "Latest Morphe patches release: ${latest}"
          echo "Existing build release for this patch release: ${already_released:-none}"

          if [ -n "$already_released" ]; then
            echo "No new Morphe patch release found."
            exit 0
          fi

          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_REF_NAME}" \
            -f targets="youtube,youtube-music,reddit" \
            -f cli_version="latest" \
            -f patches_version="${latest}" \
            -f apk_version_source="recommended" \
            -f force_patch="true" \
            -f continue_on_error="true" \
            -f create_release="true" \
            -f upload_artifact="true"

          echo "Triggered build workflow for Morphe patches ${latest}."

name: Watch Morphe patches

on:
  schedule:
    - cron: "17 0 * * 0"
  workflow_dispatch:
    inputs:
      apk_fallback_to_latest:
        description: "Fall back to latest available APK if the recommended APK version disappears"
        required: true
        type: boolean
        default: false

jobs:
  watch:
    name: Trigger builds on new patch releases
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check latest Morphe patch releases
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APK_FALLBACK_TO_LATEST: ${{ inputs.apk_fallback_to_latest }}
          REPO_APK_FALLBACK_TO_LATEST: ${{ vars.APK_FALLBACK_TO_LATEST }}
        run: |
          apk_fallback_to_latest="${REPO_APK_FALLBACK_TO_LATEST:-false}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            apk_fallback_to_latest="${INPUT_APK_FALLBACK_TO_LATEST:-false}"
          fi

          case "${apk_fallback_to_latest,,}" in
            true|1|yes|on)
              apk_fallback_to_latest="true"
              ;;
            *)
              apk_fallback_to_latest="false"
              ;;
          esac

          stable="$(gh api 'repos/MorpheApp/morphe-patches/releases?per_page=100' --jq 'map(select(.draft == false and .prerelease == false))[0].tag_name')"
          dev="$(gh api 'repos/MorpheApp/morphe-patches/releases?per_page=100' --jq 'map(select(.draft == false and .prerelease == true))[0].tag_name')"
          release_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')"
          triggered="0"

          find_existing_release() {
            local patches_tag="$1"
            local build_variant="$2"

            while IFS= read -r release_tag; do
              if [ -z "$release_tag" ]; then
                continue
              fi

              release_body="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)"
              if printf '%s\n' "$release_body" | grep -Fq -- "- Morphe patches: ${patches_tag}" &&
                 printf '%s\n' "$release_body" | grep -Fq -- "- Build variant: ${build_variant}"; then
                printf '%s\n' "$release_tag"
                return 0
              fi
            done <<< "$release_tags"

            return 1
          }

          trigger_standard_build() {
            local channel="$1"
            local patches_tag="$2"

            gh workflow run build.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "${GITHUB_REF_NAME}" \
              -f targets="youtube,youtube-music,reddit" \
              -f cli_version="latest" \
              -f patches_version="${patches_tag}" \
              -f apk_version_source="recommended" \
              -f apk_fallback_to_latest="${apk_fallback_to_latest}" \
              -f force_patch="true" \
              -f continue_on_error="true" \
              -f create_release="true" \
              -f upload_artifact="true"

            triggered="1"
            echo "Triggered standard APK build for ${channel} Morphe patches ${patches_tag}."
          }

          check_channel() {
            local channel="$1"
            local patches_tag="$2"

            if [ -z "$patches_tag" ] || [ "$patches_tag" = "null" ]; then
              echo "No ${channel} Morphe patch release found."
              return
            fi

            echo "Latest ${channel} Morphe patches release: ${patches_tag}"

            standard_release="$(find_existing_release "$patches_tag" "standard APK" || true)"
            echo "Existing standard APK release for ${patches_tag}: ${standard_release:-none}"
            if [ -z "$standard_release" ]; then
              trigger_standard_build "$channel" "$patches_tag"
            fi
          }

          check_channel "stable" "$stable"
          check_channel "dev" "$dev"

          if [ "$triggered" = "0" ]; then
            echo "No new Morphe stable or dev patch builds needed."
          fi

name: Daily Patch Sync & Builder

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run build even if no new patch version is detected"
        type: boolean
        default: false
      release_mode:
        description: "Release mode: 'separate' (dedicated release for each builder) or 'combined' (single shared release)"
        type: choice
        options:
          - separate
          - combined
        default: separate
      release_tag:
        description: "Custom release tag (only used if release_mode is 'combined'; defaults to 'auto-release')"
        type: string
        default: "auto-release"
      youtube_abis:
        description: "YouTube/YouTube Music ABI artifacts to build"
        type: choice
        options:
          - "arm64-v8a"
          - "arm64-v8a,arm-v7a"
        default: "arm64-v8a"
      build_apks:
        description: "Build non-root patched APKs"
        type: boolean
        default: true
      build_root_modules:
        description: "Build root Magisk/KernelSU modules"
        type: boolean
        default: true
      run_morphe:
        description: "Build Morphe APK & Root Module"
        type: boolean
        default: true
      run_piko:
        description: "Build Piko patched APKs (New Builder)"
        type: boolean
        default: true
      run_anddea:
        description: "Build Anddea APKs & Root Modules"
        type: boolean
        default: true
      run_devanced:
        description: "Build De-Vanced Google Photos APK & Root Module"
        type: boolean
        default: true
      check_apk_releases:
        description: "Check for new APK releases (e.g. Google Photos) in addition to patch versions"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  check-and-update-configs:
    name: Check Patches & Update Configs
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      morphe_release_tag: ${{ steps.check.outputs.morphe_release_tag }}
      piko_release_tag: ${{ steps.check.outputs.piko_release_tag }}
      anddea_release_tag: ${{ steps.check.outputs.anddea_release_tag }}
      devanced_release_tag: ${{ steps.check.outputs.devanced_release_tag }}
      morphe_tag: ${{ steps.check.outputs.morphe_tag }}
      piko_tag: ${{ steps.check.outputs.piko_tag }}
      anddea_tag: ${{ steps.check.outputs.anddea_tag }}
      devanced_tag: ${{ steps.check.outputs.devanced_tag }}
      devanced_google_photos_apk: ${{ steps.check.outputs.devanced_google_photos_apk }}
      morphe_changed: ${{ steps.check.outputs.morphe_changed }}
      piko_changed: ${{ steps.check.outputs.piko_changed }}
      anddea_changed: ${{ steps.check.outputs.anddea_changed }}
      devanced_changed: ${{ steps.check.outputs.devanced_changed }}
      devanced_apk_changed: ${{ steps.check.outputs.devanced_apk_changed }}
      devanced_apk_source: ${{ steps.check.outputs.devanced_apk_source }}
      run_morphe: ${{ steps.check.outputs.run_morphe }}
      run_piko: ${{ steps.check.outputs.run_piko }}
      run_anddea: ${{ steps.check.outputs.run_anddea }}
      run_devanced: ${{ steps.check.outputs.run_devanced }}
      build_apks: ${{ steps.check.outputs.build_apks }}
      build_root_modules: ${{ steps.check.outputs.build_root_modules }}
      youtube_abis: ${{ steps.check.outputs.youtube_abis }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Upstream Releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RUN: ${{ inputs.force_run }}
          RELEASE_MODE: ${{ inputs.release_mode || 'separate' }}
          TARGET_RELEASE_TAG: ${{ inputs.release_tag || 'auto-release' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_MORPHE: ${{ inputs.run_morphe }}
          INPUT_RUN_PIKO: ${{ inputs.run_piko }}
          INPUT_RUN_ANDDEA: ${{ inputs.run_anddea }}
          INPUT_RUN_DEVANCED: ${{ inputs.run_devanced }}
          INPUT_CHECK_APK_RELEASES: ${{ inputs.check_apk_releases }}
          INPUT_BUILD_APKS: ${{ inputs.build_apks }}
          INPUT_BUILD_ROOT_MODULES: ${{ inputs.build_root_modules }}
          INPUT_YOUTUBE_ABIS: ${{ inputs.youtube_abis }}
        run: |
          # Query latest releases including betas / pre-releases
          morphe_latest="$(gh api repos/MorpheApp/morphe-patches/releases --jq '[.[] | select(.draft == false)][0].tag_name' 2>/dev/null || echo '')"
          piko_latest="$(gh api repos/crimera/piko/releases --jq '[.[] | select(.draft == false)][0].tag_name' 2>/dev/null || echo '')"
          anddea_latest="$(gh api repos/anddea/revanced-patches/releases --jq '[.[] | select(.draft == false)][0].tag_name' 2>/dev/null || echo '')"
          devanced_latest="$(gh api repos/RookieEnough/De-Vanced/releases --jq '[.[] | select(.draft == false)][0].tag_name' 2>/dev/null || echo '')"

          echo "Upstream latest Morphe: $morphe_latest"
          echo "Upstream latest Piko: $piko_latest"
          echo "Upstream latest Anddea: $anddea_latest"
          echo "Upstream latest De-Vanced: $devanced_latest"

          export MORPHE_LATEST="$morphe_latest"
          export PIKO_LATEST="$piko_latest"
          export ANDDEA_LATEST="$anddea_latest"
          export DEVANCED_LATEST="$devanced_latest"

          morphe_exists="false"
          piko_exists="false"
          anddea_exists="false"
          devanced_exists="false"
          if gh release view "morphe-release" >/dev/null 2>&1; then morphe_exists="true"; fi
          if gh release view "piko-release" >/dev/null 2>&1; then piko_exists="true"; fi
          if gh release view "anddea-release" >/dev/null 2>&1; then anddea_exists="true"; fi
          if gh release view "devanced-release" >/dev/null 2>&1; then devanced_exists="true"; fi

          target_release_tag="${TARGET_RELEASE_TAG:-auto-release}"
          combined_exists="false"
          if gh release view "$target_release_tag" >/dev/null 2>&1; then combined_exists="true"; fi

          export MORPHE_RELEASE_EXISTS="$morphe_exists"
          export PIKO_RELEASE_EXISTS="$piko_exists"
          export ANDDEA_RELEASE_EXISTS="$anddea_exists"
          export DEVANCED_RELEASE_EXISTS="$devanced_exists"
          export COMBINED_RELEASE_EXISTS="$combined_exists"

          devanced_asset_apk=""
          if [ "$devanced_exists" = "true" ]; then
            devanced_asset_apk="$(gh release view "devanced-release" --json assets --jq '.assets[].name' 2>/dev/null | grep -oE 'google-photos-[0-9.]+(-patched\.apk|-root-module\.zip)' | head -n1 | sed -E 's/google-photos-([0-9.]+)-(patched\.apk|root-module\.zip)/\1/' || true)"
          fi
          if [ -z "$devanced_asset_apk" ]; then
            devanced_asset_apk="$(gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null | grep -E '^devanced' | head -n1 | xargs -I{} gh release view "{}" --json assets --jq '.assets[].name' 2>/dev/null | grep -oE 'google-photos-[0-9.]+(-patched\.apk|-root-module\.zip)' | head -n1 | sed -E 's/google-photos-([0-9.]+)-(patched\.apk|root-module\.zip)/\1/' || true)"
          fi
          export DEVANCED_ASSET_APK="$devanced_asset_apk"

          echo "Existing releases: morphe=$morphe_exists, piko=$piko_exists, anddea=$anddea_exists, devanced=$devanced_exists (asset_apk=${devanced_asset_apk:-none}), combined($target_release_tag)=$combined_exists"

          node -e '
            (async () => {
              const fs = require("node:fs");

              async function getLatestGooglePhotosVersion() {
                try {
                  const res = await fetch("https://d.apkpure.net/b/APK/com.google.android.apps.photos?version=latest", {
                    method: "HEAD",
                    redirect: "follow",
                    headers: {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "Accept": "application/vnd.android.package-archive,*/*"
                    }
                  });
                  if (res.ok) {
                    const cd = res.headers.get("content-disposition") || "";
                    const finalUrl = res.url || "";
                    const m = (cd + " " + finalUrl).match(/_(\d+(?:\.\d+)+)_APKPure/i) || (cd + " " + finalUrl).match(/(\d+\.\d+\.\d+\.\d+)/);
                    if (m && m[1]) return m[1];
                  }
                } catch (e) {
                  console.warn("APKPure Google Photos check failed:", e.message);
                }

                try {
                  const res = await fetch("https://google-photos.en.uptodown.com/android/versions", {
                    headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
                  });
                  if (res.ok) {
                    const html = await res.text();
                    const m = html.match(/data-version="([^"]+)"/) || html.match(/(\d+\.\d+\.\d+\.\d+)/);
                    if (m && m[1]) return m[1];
                  }
                } catch (e) {
                  console.warn("Uptodown Google Photos check failed:", e.message);
                }

                return "";
              }

              let state = { morphe: "", piko: "", anddea: "", devanced: "", devanced_google_photos_apk: "" };
              try {
                state = JSON.parse(fs.readFileSync("config/patch-versions.json", "utf8"));
              } catch {}

              const morphe = (process.env.MORPHE_LATEST || state.morphe || "").trim();
              const piko = (process.env.PIKO_LATEST || state.piko || "").trim();
              const anddea = (process.env.ANDDEA_LATEST || state.anddea || "").trim();
              const devanced = (process.env.DEVANCED_LATEST || state.devanced || "").trim();
              const force = process.env.FORCE_RUN === "true";

              const checkApkReleases = process.env.EVENT_NAME === "schedule" ? true : (process.env.INPUT_CHECK_APK_RELEASES !== "false");
              let latestGooglePhotosApk = "";
              if (checkApkReleases) {
                latestGooglePhotosApk = (await getLatestGooglePhotosVersion()) || "";
              }
              const recordedGooglePhotosApk = (state.devanced_google_photos_apk || process.env.DEVANCED_ASSET_APK || "").trim();

              const releaseMode = process.env.RELEASE_MODE || "separate";
              const baseTag = process.env.TARGET_RELEASE_TAG || "auto-release";

              const morpheReleaseTag = releaseMode === "separate" ? "morphe-release" : baseTag;
              const pikoReleaseTag = releaseMode === "separate" ? "piko-release" : baseTag;
              const anddeaReleaseTag = releaseMode === "separate" ? "anddea-release" : baseTag;
              const devancedReleaseTag = releaseMode === "separate" ? "devanced-release" : baseTag;

              const morpheReleaseExists = process.env.MORPHE_RELEASE_EXISTS === "true";
              const pikoReleaseExists = process.env.PIKO_RELEASE_EXISTS === "true";
              const anddeaReleaseExists = process.env.ANDDEA_RELEASE_EXISTS === "true";
              const devancedReleaseExists = process.env.DEVANCED_RELEASE_EXISTS === "true";
              const combinedReleaseExists = process.env.COMBINED_RELEASE_EXISTS === "true";

              const morpheMissing = releaseMode === "separate" ? !morpheReleaseExists : !combinedReleaseExists;
              const pikoMissing = releaseMode === "separate" ? !pikoReleaseExists : !combinedReleaseExists;
              const anddeaMissing = releaseMode === "separate" ? !anddeaReleaseExists : !combinedReleaseExists;
              const devancedMissing = releaseMode === "separate" ? !devancedReleaseExists : !combinedReleaseExists;

              const morpheChanged = Boolean(morphe && (!state.morphe || morphe !== state.morphe));
              const pikoChanged = Boolean(piko && (!state.piko || piko !== state.piko));
              const anddeaChanged = Boolean(anddea && (!state.anddea || anddea !== state.anddea));
              const devancedChanged = Boolean(devanced && (!state.devanced || devanced !== state.devanced));

              const devancedApkChanged = Boolean(
                checkApkReleases &&
                latestGooglePhotosApk &&
                recordedGooglePhotosApk &&
                latestGooglePhotosApk !== recordedGooglePhotosApk
              );
              const devancedApkMissing = Boolean(
                checkApkReleases &&
                latestGooglePhotosApk &&
                !recordedGooglePhotosApk
              );

              const isSchedule = process.env.EVENT_NAME === "schedule";
              const inputRunMorphe = isSchedule ? true : (process.env.INPUT_RUN_MORPHE !== "false");
              const inputRunPiko = isSchedule ? true : (process.env.INPUT_RUN_PIKO !== "false");
              const inputRunAnddea = isSchedule ? true : (process.env.INPUT_RUN_ANDDEA !== "false");
              const inputRunDevanced = isSchedule ? true : (process.env.INPUT_RUN_DEVANCED !== "false");

              const runMorphe = inputRunMorphe && (force || morpheChanged || morpheMissing);
              const runPiko = inputRunPiko && (force || pikoChanged || pikoMissing);
              const runAnddea = inputRunAnddea && (force || anddeaChanged || anddeaMissing);
              const runDevanced = inputRunDevanced && (force || devancedChanged || devancedMissing || devancedApkChanged || devancedApkMissing);

              const devancedApkSource = devancedApkChanged ? (latestGooglePhotosApk || "latest") : "recommended";

              const shouldBuild = runMorphe || runPiko || runAnddea || runDevanced;

              const buildApks = isSchedule ? true : (process.env.INPUT_BUILD_APKS !== "false");
              const buildRootModules = isSchedule ? true : (process.env.INPUT_BUILD_ROOT_MODULES !== "false");
              const youtubeAbis = process.env.INPUT_YOUTUBE_ABIS || "arm64-v8a";

              console.log(`Current state: Morphe=${state.morphe}, Piko=${state.piko}, Anddea=${state.anddea}, De-Vanced=${state.devanced}, GooglePhotosAPK=${recordedGooglePhotosApk || "none"}`);
              console.log(`Target state:  Morphe=${morphe}, Piko=${piko}, Anddea=${anddea}, De-Vanced=${devanced}, GooglePhotosAPK=${latestGooglePhotosApk || "none"}`);
              console.log(`Version changes: Morphe=${morpheChanged}, Piko=${pikoChanged}, Anddea=${anddeaChanged}, De-Vanced=${devancedChanged}, GooglePhotosAPK=${devancedApkChanged} (missing=${devancedApkMissing})`);
              console.log(`Releases missing: Morphe=${morpheMissing}, Piko=${pikoMissing}, Anddea=${anddeaMissing}, De-Vanced=${devancedMissing}`);
              console.log(`Build trigger decision: shouldBuild=${shouldBuild} (force=${force})`);
              console.log(`Run builders: morphe=${runMorphe} (${morpheReleaseTag}), piko=${runPiko} (${pikoReleaseTag}), anddea=${runAnddea} (${anddeaReleaseTag}), devanced=${runDevanced} (${devancedReleaseTag})`);
              console.log(`Artifact options: youtubeAbis=${youtubeAbis}, buildApks=${buildApks}, buildRootModules=${buildRootModules}, devancedApkSource=${devancedApkSource}`);

              if (shouldBuild) {
                const anyChanged = morpheChanged || pikoChanged || anddeaChanged || devancedChanged || devancedApkChanged;
                const newState = {
                  morphe: (runMorphe || morpheChanged) ? morphe : (state.morphe || morphe),
                  piko: (runPiko || pikoChanged) ? piko : (state.piko || piko),
                  anddea: (runAnddea || anddeaChanged) ? anddea : (state.anddea || anddea),
                  devanced: (runDevanced || devancedChanged) ? devanced : (state.devanced || devanced),
                  devanced_google_photos_apk: latestGooglePhotosApk || recordedGooglePhotosApk || state.devanced_google_photos_apk || "",
                  updated_at: anyChanged ? new Date().toISOString() : (state.updated_at || new Date().toISOString())
                };
                fs.writeFileSync("config/patch-versions.json", JSON.stringify(newState, null, 2) + "\n");
              }

              const outputFile = process.env.GITHUB_OUTPUT;
              if (outputFile) {
                fs.appendFileSync(outputFile, `should_build=${shouldBuild ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `release_tag=${baseTag}\n`);
                fs.appendFileSync(outputFile, `morphe_release_tag=${morpheReleaseTag}\n`);
                fs.appendFileSync(outputFile, `piko_release_tag=${pikoReleaseTag}\n`);
                fs.appendFileSync(outputFile, `anddea_release_tag=${anddeaReleaseTag}\n`);
                fs.appendFileSync(outputFile, `devanced_release_tag=${devancedReleaseTag}\n`);
                fs.appendFileSync(outputFile, `morphe_tag=${morphe}\n`);
                fs.appendFileSync(outputFile, `piko_tag=${piko}\n`);
                fs.appendFileSync(outputFile, `anddea_tag=${anddea}\n`);
                fs.appendFileSync(outputFile, `devanced_tag=${devanced}\n`);
                fs.appendFileSync(outputFile, `devanced_google_photos_apk=${latestGooglePhotosApk || recordedGooglePhotosApk}\n`);
                fs.appendFileSync(outputFile, `devanced_apk_changed=${devancedApkChanged ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `devanced_apk_source=${devancedApkSource}\n`);
                fs.appendFileSync(outputFile, `morphe_changed=${morpheChanged ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `piko_changed=${pikoChanged ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `anddea_changed=${anddeaChanged ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `devanced_changed=${devancedChanged ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `run_morphe=${runMorphe ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `run_piko=${runPiko ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `run_anddea=${runAnddea ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `run_devanced=${runDevanced ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `build_apks=${buildApks ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `build_root_modules=${buildRootModules ? "true" : "false"}\n`);
                fs.appendFileSync(outputFile, `youtube_abis=${youtubeAbis}\n`);
              }
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: Update Patch Options in Config Folder
        if: steps.check.outputs.should_build == 'true'
        run: |
          if [ "${{ steps.check.outputs.run_morphe }}" = "true" ] || [ "${{ steps.check.outputs.morphe_changed }}" = "true" ]; then
            echo "Updating Morphe options..."
            node scripts/morphe.mjs options --refresh-tools || true
          fi
          if [ "${{ steps.check.outputs.run_piko }}" = "true" ] || [ "${{ steps.check.outputs.piko_changed }}" = "true" ]; then
            echo "Updating Piko options..."
            node scripts/piko-builder.mjs options || true
          fi
          if [ "${{ steps.check.outputs.run_anddea }}" = "true" ] || [ "${{ steps.check.outputs.anddea_changed }}" = "true" ]; then
            echo "Updating Anddea options..."
            node scripts/anddea-builder.mjs options --refresh-tools || true
          fi
          if [ "${{ steps.check.outputs.run_devanced }}" = "true" ] || [ "${{ steps.check.outputs.devanced_changed }}" = "true" ]; then
            echo "Updating De-Vanced options..."
            node scripts/devanced-builder.mjs options --refresh-tools || true
          fi

      - name: Commit and Push Updated Config Files
        if: steps.check.outputs.should_build == 'true'
        run: |
          if [ -n "$(git status --porcelain config/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config/
            git commit -m "chore(config): auto-update patch lists and options"
            git push origin main
          else
            echo "No config changes to commit."
          fi

  build-morphe:
    name: Morphe APK & Root Module Builder
    needs: check-and-update-configs
    if: needs.check-and-update-configs.result == 'success' && needs.check-and-update-configs.outputs.should_build == 'true' && needs.check-and-update-configs.outputs.run_morphe == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.check-and-update-configs.outputs.morphe_release_tag }}
      patches_version: ${{ needs.check-and-update-configs.outputs.morphe_tag || 'dev' }}
      targets: "youtube,youtube-music,reddit"
      youtube_abis: ${{ needs.check-and-update-configs.outputs.youtube_abis }}
      build_apks: ${{ needs.check-and-update-configs.outputs.build_apks == 'true' }}
      build_root_modules: ${{ needs.check-and-update-configs.outputs.build_root_modules == 'true' }}
      create_release: true
      upload_artifact: true

  build-piko:
    name: Build Piko patched APKs (New Builder)
    needs: [check-and-update-configs, build-morphe]
    if: |
      always() && !cancelled() &&
      needs.check-and-update-configs.result == 'success' &&
      needs.check-and-update-configs.outputs.should_build == 'true' &&
      needs.check-and-update-configs.outputs.run_piko == 'true'
    uses: ./.github/workflows/build-piko-new.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.check-and-update-configs.outputs.piko_release_tag }}
      patches_version: ${{ needs.check-and-update-configs.outputs.piko_tag || 'dev' }}
      targets: "twitter,instagram"
      create_release: true
      upload_artifact: true

  build-anddea:
    name: Build Anddea APKs & Root Modules
    needs: [check-and-update-configs, build-piko]
    if: |
      always() && !cancelled() &&
      needs.check-and-update-configs.result == 'success' &&
      needs.check-and-update-configs.outputs.should_build == 'true' &&
      needs.check-and-update-configs.outputs.run_anddea == 'true'
    uses: ./.github/workflows/build-anddea.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.check-and-update-configs.outputs.anddea_release_tag }}
      patches_version: ${{ needs.check-and-update-configs.outputs.anddea_tag || 'dev' }}
      targets: "youtube,youtube-music"
      youtube_abis: ${{ needs.check-and-update-configs.outputs.youtube_abis }}
      build_apks: ${{ needs.check-and-update-configs.outputs.build_apks == 'true' }}
      build_root_modules: ${{ needs.check-and-update-configs.outputs.build_root_modules == 'true' }}
      create_release: true
      upload_artifact: true

  build-devanced:
    name: Build De-Vanced Google Photos APK & Root Module
    needs: [check-and-update-configs, build-anddea]
    if: |
      always() && !cancelled() &&
      needs.check-and-update-configs.result == 'success' &&
      needs.check-and-update-configs.outputs.should_build == 'true' &&
      needs.check-and-update-configs.outputs.run_devanced == 'true'
    uses: ./.github/workflows/build-devanced.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.check-and-update-configs.outputs.devanced_release_tag }}
      patches_version: ${{ needs.check-and-update-configs.outputs.devanced_tag || 'stable' }}
      targets: "google-photos"
      apk_version_source: ${{ needs.check-and-update-configs.outputs.devanced_apk_source || 'recommended' }}
      apk_fallback_to_latest: true
      build_apks: ${{ needs.check-and-update-configs.outputs.build_apks == 'true' }}
      build_root_modules: ${{ needs.check-and-update-configs.outputs.build_root_modules == 'true' }}
      create_release: true
      upload_artifact: true

name: Morphe APK & Root Module Builder

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets: youtube,youtube-music,reddit. YouTube targets expand according to YouTube ABIs."
        required: true
        default: "youtube,youtube-music,reddit"
      youtube_abis:
        description: "YouTube/YouTube Music ABI artifacts to build"
        required: true
        type: choice
        default: "arm64-v8a,arm-v7a"
        options:
          - "arm64-v8a,arm-v7a"
          - "arm64-v8a"
      cli_version:
        description: "Morphe CLI tag, or latest"
        required: true
        default: "dev"
      patches_version:
        description: "Morphe patches: stable, dev, latest, or an explicit tag"
        required: true
        default: "dev"
      apk_version_source:
        description: "Global APK version source"
        required: true
        type: choice
        default: "recommended"
        options:
          - "recommended"
          - "latest"
      apk_fallback_to_latest:
        description: "Fall back to latest available APK if the recommended APK version disappears"
        required: true
        type: boolean
        default: false
      force_patch:
        description: "Pass --force to skip Morphe APK version compatibility checks"
        required: true
        type: boolean
        default: true
      continue_on_error:
        description: "Pass --continue-on-error so compatible patches can still be applied if one patch fails"
        required: true
        type: boolean
        default: true
      include_patches:
        description: "Comma-separated disabled patches to enable for this run (e.g. 'Override certificate pinning, Change package name'). Leave blank to use default patch selection."
        required: false
        default: ""
      build_apks:
        description: "Build non-root patched APKs"
        required: true
        type: boolean
        default: true
      build_root_modules:
        description: "Build root Magisk/KernelSU modules"
        required: true
        type: boolean
        default: false
      create_release:
        description: "Create a GitHub Release and attach assets"
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: "Upload assets as a short-lived workflow artifact"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Custom GitHub Release tag (optional; if empty, generates timestamp tag)"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      targets:
        type: string
        default: "youtube,youtube-music,reddit"
      youtube_abis:
        type: string
        default: "arm64-v8a"
      cli_version:
        type: string
        default: "dev"
      patches_version:
        type: string
        default: "dev"
      apk_version_source:
        type: string
        default: "recommended"
      apk_fallback_to_latest:
        type: boolean
        default: false
      force_patch:
        type: boolean
        default: true
      continue_on_error:
        type: boolean
        default: true
      include_patches:
        type: string
        default: ""
      build_apks:
        type: boolean
        default: true
      build_root_modules:
        type: boolean
        default: false
      create_release:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: true
      release_tag:
        type: string
        default: ""

jobs:
  build:
    name: Morphe APK & Root Module Builder
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Morphe tools
        env:
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          MORPHE_PATCHES_VERSION: ${{ inputs.patches_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/morphe.mjs tools

      - name: Restore optional signing keystore
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          APK_KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [ -n "$APK_KEYSTORE_B64" ]; then
            if [ -z "$APK_KEYSTORE_PASSWORD" ] || [ -z "$APK_KEYSTORE_ENTRY_PASSWORD" ]; then
              echo "::error::APK_KEYSTORE_B64 is set, but APK_KEYSTORE_PASSWORD or APK_KEYSTORE_ENTRY_PASSWORD is missing."
              exit 1
            fi
            mkdir -p .secrets
            printf '%s' "$APK_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > .secrets/mistu-release-source.jks

            cat > .secrets/ConvertKeystore.java <<'JAVA'
            import java.io.InputStream;
            import java.io.OutputStream;
            import java.nio.file.Files;
            import java.nio.file.Path;
            import java.security.Key;
            import java.security.KeyStore;
            import java.security.Provider;
            import java.security.Security;
            import java.security.cert.Certificate;
            import org.bouncycastle.jce.provider.BouncyCastleProvider;

            public final class ConvertKeystore {
              private record LoadedStore(KeyStore store, String type) {}

              public static void main(String[] args) throws Exception {
                Path input = Path.of(args[0]);
                Path output = Path.of(args[1]);
                char[] storePassword = requiredEnv("APK_KEYSTORE_PASSWORD").toCharArray();
                char[] entryPassword = envOr("APK_KEYSTORE_ENTRY_PASSWORD", requiredEnv("APK_KEYSTORE_PASSWORD")).toCharArray();
                String alias = envOr("APK_KEYSTORE_ALIAS", "mistu");

                Provider bc = new BouncyCastleProvider();
                if (Security.getProvider(bc.getName()) == null) Security.addProvider(bc);

                LoadedStore loaded = loadStore(input, storePassword);
                Key key = loaded.store().getKey(alias, entryPassword);
                if (key == null) {
                  throw new IllegalStateException("Signing key alias not found in " + loaded.type() + " keystore: " + alias);
                }

                Certificate[] chain = loaded.store().getCertificateChain(alias);
                if (chain == null) {
                  Certificate certificate = loaded.store().getCertificate(alias);
                  if (certificate == null) {
                    throw new IllegalStateException("No certificate found for signing key alias: " + alias);
                  }
                  chain = new Certificate[] { certificate };
                }

                KeyStore bks = KeyStore.getInstance("BKS", "BC");
                bks.load(null, storePassword);
                bks.setKeyEntry(alias, key, entryPassword, chain);

                try (OutputStream stream = Files.newOutputStream(output)) {
                  bks.store(stream, storePassword);
                }
              }

              private static LoadedStore loadStore(Path path, char[] password) throws Exception {
                Exception last = null;
                for (String type : new String[] { "JKS", "PKCS12", "BKS" }) {
                  try {
                    KeyStore store = "BKS".equals(type)
                      ? KeyStore.getInstance(type, "BC")
                      : KeyStore.getInstance(type);
                    try (InputStream stream = Files.newInputStream(path)) {
                      store.load(stream, password);
                    }
                    return new LoadedStore(store, type);
                  } catch (Exception error) {
                    last = error;
                  }
                }

                throw new IllegalStateException("Could not load signing keystore as JKS, PKCS12, or BKS.", last);
              }

              private static String requiredEnv(String name) {
                String value = System.getenv(name);
                if (value == null || value.isEmpty()) {
                  throw new IllegalStateException(name + " is required");
                }
                return value;
              }

              private static String envOr(String name, String fallback) {
                String value = System.getenv(name);
                return value == null || value.isEmpty() ? fallback : value;
              }
            }
          JAVA

            javac -cp .cache/tools/morphe-cli.jar .secrets/ConvertKeystore.java
            java -cp ".cache/tools/morphe-cli.jar:.secrets" ConvertKeystore \
              .secrets/mistu-release-source.jks \
              .secrets/mistu-release.jks
            echo "KEYSTORE_FILE=.secrets/mistu-release.jks" >> "$GITHUB_ENV"
          fi

      - name: List available patches
        run: node .github/scripts/list-patches.mjs >> "$GITHUB_STEP_SUMMARY"


      - name: Configure Morphe patch flags
        env:
          FORCE_PATCH: ${{ inputs.force_patch }}
          CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
          INCLUDE_PATCHES: ${{ inputs.include_patches }}
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const args = [];
          if (process.env.FORCE_PATCH === 'true') args.push('--force');
          if (process.env.CONTINUE_ON_ERROR === 'true') args.push('--continue-on-error');
          const include = (process.env.INCLUDE_PATCHES || '').split(',').map(s => s.trim()).filter(Boolean);
          for (const patch of include) { args.push('--enable', patch); }
          if (include.length) process.stderr.write(`Enabling extra patches: ${include.join(', ')}\n`);
          console.log(`MORPHE_EXTRA_ARGS_JSON=${JSON.stringify(args)}`);
          NODE

      - name: Build patched APKs
        if: ${{ inputs.build_apks }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          YOUTUBE_ABIS: ${{ inputs.youtube_abis }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          MORPHE_PATCHES_VERSION: ${{ inputs.patches_version }}
          APK_SOURCE: apkmirror,apkpure,uptodown,divxland
          APK_VERSION_SOURCE: ${{ inputs.apk_version_source }}
          APK_FALLBACK_TO_LATEST: ${{ inputs.apk_fallback_to_latest }}
          YOUTUBE_APK_URL: ${{ secrets.YOUTUBE_APK_URL }}
          YOUTUBE_MUSIC_APK_URL: ${{ secrets.YOUTUBE_MUSIC_APK_URL }}
          REDDIT_APK_URL: ${{ secrets.REDDIT_APK_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          SIGNER_NAME: Mistu
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/morphe.mjs build

      - name: Build root APK variants
        if: ${{ inputs.build_root_modules }}
        env:
          ROOT_BUILD: "1"
          BUILD_TARGETS: ${{ inputs.targets }}
          YOUTUBE_ABIS: ${{ inputs.youtube_abis }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          MORPHE_PATCHES_VERSION: ${{ inputs.patches_version }}
          APK_SOURCE: apkmirror,apkpure,uptodown,divxland
          APK_VERSION_SOURCE: ${{ inputs.apk_version_source }}
          APK_FALLBACK_TO_LATEST: ${{ inputs.apk_fallback_to_latest }}
          YOUTUBE_APK_URL: ${{ secrets.YOUTUBE_APK_URL }}
          YOUTUBE_MUSIC_APK_URL: ${{ secrets.YOUTUBE_MUSIC_APK_URL }}
          REDDIT_APK_URL: ${{ secrets.REDDIT_APK_URL }}
          YOUTUBE_OUT: output/root/youtube-root.apk
          YOUTUBE_RESULT: output/root/youtube-result.json
          YOUTUBE_OPTIONS: config/root/youtube-options.json
          YOUTUBE_MUSIC_OUT: output/root/youtube-music-root.apk
          YOUTUBE_MUSIC_RESULT: output/root/youtube-music-result.json
          YOUTUBE_MUSIC_OPTIONS: config/root/youtube-music-options.json
          REDDIT_OUT: output/root/reddit-root.apk
          REDDIT_RESULT: output/root/reddit-result.json
          REDDIT_OPTIONS: config/root/reddit-options.json
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS || 'mistu' }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.APK_KEYSTORE_ENTRY_PASSWORD }}
          SIGNER_NAME: Mistu
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/morphe.mjs build

      - name: Package root modules
        if: ${{ inputs.build_root_modules }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          ROOT_BUILD: "1"
          YOUTUBE_ABIS: ${{ inputs.youtube_abis }}
          YOUTUBE_OUT: output/root/youtube-root.apk
          YOUTUBE_MUSIC_OUT: output/root/youtube-music-root.apk
          REDDIT_OUT: output/root/reddit-root.apk
        run: node scripts/morphe.mjs root-modules

      - name: Validate release outputs
        if: ${{ inputs.create_release && inputs.build_apks }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          YOUTUBE_ABIS: ${{ inputs.youtube_abis }}
        run: node scripts/morphe.mjs release-check

      - name: Prepare release metadata
        if: ${{ inputs.create_release }}
        env:
          BUILD_TARGETS: ${{ inputs.targets }}
          YOUTUBE_ABIS: ${{ inputs.youtube_abis }}
          APK_VERSION_SOURCE: ${{ inputs.apk_version_source }}
          APK_FALLBACK_TO_LATEST: ${{ inputs.apk_fallback_to_latest }}
          GH_TOKEN: ${{ github.token }}
          PATCHES_VERSION: ${{ inputs.patches_version }}
          MORPHE_CLI_VERSION: ${{ inputs.cli_version }}
          YOUTUBE_OUT: output/root/youtube-root.apk
          YOUTUBE_RESULT: output/root/youtube-result.json
          YOUTUBE_MUSIC_OUT: output/root/youtube-music-root.apk
          YOUTUBE_MUSIC_RESULT: output/root/youtube-music-result.json
          REDDIT_OUT: output/root/reddit-root.apk
          REDDIT_RESULT: output/root/reddit-result.json
        run: |
          release_date="$(date -u +'%Y-%m-%d')"
          release_stamp="$(date -u +'%Y%m%d-%H%M%S')"

          if [ "${{ inputs.build_apks }}" = "true" ] && [ "${{ inputs.build_root_modules }}" = "true" ]; then
            tag="build-${release_stamp}-${GITHUB_RUN_NUMBER}"
            name_prefix="Morph patched APKs & root modules"
          elif [ "${{ inputs.build_root_modules }}" = "true" ]; then
            tag="root-build-${release_stamp}-${GITHUB_RUN_NUMBER}"
            name_prefix="Morph root modules"
          else
            tag="build-${release_stamp}-${GITHUB_RUN_NUMBER}"
            name_prefix="Morph patched APKs"
          fi

          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          fi

          release_prerelease_flag=""
          resolved_patches_tag="$(node -e 'const fs = require("node:fs"); let tag = process.env.PATCHES_VERSION || "latest"; try { tag = JSON.parse(fs.readFileSync(".cache/tools/patches.json", "utf8")).tag || tag; } catch {} process.stdout.write(tag);')"

          case "${PATCHES_VERSION,,}" in
            dev|pre|preview|prerelease|pre-release)
              release_prerelease_flag="--prerelease"
              ;;
            stable|latest)
              release_prerelease_flag=""
              ;;
            *)
              patches_tag="$PATCHES_VERSION"
              if [[ "$patches_tag" != v* ]]; then
                patches_tag="v${patches_tag}"
              fi
              if [ "$(gh api "repos/MorpheApp/morphe-patches/releases/tags/${patches_tag}" --jq '.prerelease' 2>/dev/null || echo false)" = "true" ]; then
                release_prerelease_flag="--prerelease"
              fi
              ;;
          esac
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${name_prefix} ${resolved_patches_tag} ${release_date} #${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE_FLAG=${release_prerelease_flag}" >> "$GITHUB_ENV"

          node -e '
            const fs = require("fs");
            const path = require("path");

            let patchesTag = process.env.PATCHES_VERSION || "latest";
            let patchesUrl = "https://github.com/MorpheApp/morphe-patches/releases";
            try {
              const patchesMeta = JSON.parse(fs.readFileSync(".cache/tools/patches.json", "utf8"));
              patchesTag = patchesMeta.tag || patchesTag;
              patchesUrl = patchesMeta.url || `https://github.com/MorpheApp/morphe-patches/releases/tag/${encodeURIComponent(patchesTag)}`;
            } catch {}

            let cliVersion = process.env.MORPHE_CLI_VERSION || "dev";
            try {
              const cliMeta = JSON.parse(fs.readFileSync(".cache/tools/morphe-cli.json", "utf8"));
              cliVersion = cliMeta.tag || cliVersion;
            } catch {}

            const lines = [];
            lines.push("## Morphe Build Summary");
            lines.push("");
            lines.push(`- **Patches**: [MorpheApp/morphe-patches ${patchesTag}](${patchesUrl})`);
            lines.push(`- **Morphe CLI**: ${cliVersion}`);
            lines.push(`- **Date**: ${new Date().toUTCString()}`);
            lines.push("");
            lines.push("### Compiled Artifacts");
            lines.push("");
            lines.push("| App | Version | Variant | Artifact | Status | Patches |");
            lines.push("| --- | --- | --- | --- | --- | --- |");

            let totalSucceeded = 0;
            let totalFailed = 0;

            if (fs.existsSync("output")) {
              fs.readdirSync("output").forEach(file => {
                if (file.endsWith("-result.json")) {
                  try {
                    const res = JSON.parse(fs.readFileSync(path.join("output", file), "utf8"));
                    const status = res.success !== false ? "✅ Successful" : `❌ Failed: ${res.error || "Unknown error"}`;
                    const succeeded = res.appliedPatches?.length || 0;
                    const failed = res.failedPatches?.length || 0;
                    totalSucceeded += succeeded;
                    totalFailed += failed;
                    lines.push(`| ${res.label || res.app} | ${res.packageVersion || "unknown"} | Standard APK | \`${res.artifactName || path.basename(res.output || "") || "N/A"}\` | ${status} | ✅ ${succeeded} / ❌ ${failed} |`);
                  } catch {}
                }
              });
            }

            // Pre-load all root result JSONs keyed by app id for patch count lookup
            const rootResults = {};
            if (fs.existsSync("output/root")) {
              fs.readdirSync("output/root").forEach(file => {
                if (file.endsWith("-result.json")) {
                  try {
                    const res = JSON.parse(fs.readFileSync(path.join("output/root", file), "utf8"));
                    const id = res.app || file.replace(/-result\.json$/, "");
                    rootResults[id] = res;
                  } catch {}
                }
              });
            }

            if (fs.existsSync("output/root-modules/root-modules.json")) {
              try {
                const rootMeta = JSON.parse(fs.readFileSync("output/root-modules/root-modules.json", "utf8"));
                (rootMeta.targets || []).forEach(target => {
                  const res = rootResults[target.id] || null;
                  const succeeded = res?.appliedPatches?.length || 0;
                  const failed = res?.failedPatches?.length || 0;
                  totalSucceeded += succeeded;
                  totalFailed += failed;
                  const patchCell = res ? `✅ ${succeeded} / ❌ ${failed}` : "N/A";
                  lines.push(`| ${target.label || target.id} | ${target.version} | Magisk Module | \`${path.basename(target.module)}\` | ✅ Successful | ${patchCell} |`);
                });
              } catch {}
            }

            // Report failed root builds not captured in root-modules.json
            const reportedIds = new Set(
              (() => {
                try {
                  if (!fs.existsSync("output/root-modules/root-modules.json")) return [];
                  const m = JSON.parse(fs.readFileSync("output/root-modules/root-modules.json", "utf8"));
                  return (m.targets || []).map(t => t.id);
                } catch { return []; }
              })()
            );
            Object.values(rootResults).forEach(res => {
              if (res.success === false && !reportedIds.has(res.app)) {
                lines.push(`| ${res.label || res.app} | ${res.packageVersion || "unknown"} | Magisk Module | \`N/A\` | ❌ Failed: ${res.error || "Unknown error"} | N/A |`);
              }
            });

            lines.push("");
            lines.push(`**Total Patches**: ✅ ${totalSucceeded} Succeeded / ❌ ${totalFailed} Failed`);

            fs.writeFileSync("release-notes.md", lines.join("\n"));
          '

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [ -n "$RELEASE_PRERELEASE_FLAG" ]; then
            release_args+=("$RELEASE_PRERELEASE_FLAG")
          fi

          files_to_upload=()
          if [ "${{ inputs.build_apks }}" = "true" ]; then
            for f in output/*.apk; do
              if [ -f "$f" ]; then
                files_to_upload+=("$f")
              fi
            done
          fi
          if [ "${{ inputs.build_root_modules }}" = "true" ]; then
            for f in output/root-modules/*-root-module.zip; do
              if [ -f "$f" ]; then
                files_to_upload+=("$f")
              fi
            done
          fi

          if [ ${#files_to_upload[@]} -eq 0 ]; then
            echo "::error::No files found to attach to the release."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Updating release..."
            export EXISTING_NOTES="$(gh release view "$RELEASE_TAG" --json body --jq .body 2>/dev/null || true)"
            node -e '
              const fs = require("node:fs");
              const existing = process.env.EXISTING_NOTES || "";
              const incoming = fs.readFileSync("release-notes.md", "utf8");
              const heading = "Morphe Build Summary";
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`(^|\\n)##\\s*${escaped}[\\s\\S]*?(?=\\n##\\s*|$)`, "i");
              let combined = "";
              if (regex.test(existing)) {
                combined = existing.replace(regex, `\n\n${incoming.trim()}`).trim();
              } else if (existing.trim()) {
                combined = `${existing.trim()}\n\n---\n\n${incoming.trim()}`;
              } else {
                combined = incoming.trim();
              }
              fs.writeFileSync("combined-release-notes.md", combined);
            '
            gh release edit "$RELEASE_TAG" --notes-file combined-release-notes.md
            gh release upload "$RELEASE_TAG" "${files_to_upload[@]}" --clobber
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" \
              "${files_to_upload[@]}" \
              "${release_args[@]}" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md
          fi

      - name: Upload patched APKs
        if: ${{ inputs.upload_artifact && inputs.build_apks }}
        uses: actions/upload-artifact@v4
        with:
          name: patched-apks
          path: |
            output/*.apk
            output/*-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload root modules
        if: ${{ inputs.upload_artifact && inputs.build_root_modules }}
        uses: actions/upload-artifact@v4
        with:
          name: root-modules
          path: |
            output/root-modules/*-root-module.zip
            output/root-modules/root-modules.json
            output/root/*.apk
            output/root/*-result.json
          if-no-files-found: error
          retention-days: 1
